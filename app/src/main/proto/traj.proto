syntax = "proto3";

option java_package = "com.openpositioning.PositionMe";
option java_outer_classname = "Traj";

message Trajectory {
  string android_version = 1;
  // version 2.0 (new)
  float trajectory_version = 2;
  // trajectory id/name for identification (new)
  string trajectory_id = 3;

  repeated Motion_Sample imu_data = 4;         // new proto: IMUReading
  repeated Pdr_Sample pdr_data = 5;            // new proto: RelativePosition
  repeated Position_Sample position_data = 6;  // new proto: MagnetometerReading magnetometer_data
  repeated Pressure_Sample pressure_data = 7;  // new proto: BarometerReading
  repeated Light_Sample light_data = 8;        // new proto: LightReading
  repeated ProximityReading proximity_data = 9; // new

  repeated GNSS_Sample gnss_data = 10;         // new proto: GNSSReading
  repeated WiFi_Sample wifi_data = 11;         // new proto: Fingerprint wifi_fingerprints
  repeated AP_Data aps_data = 12;              // new proto: WiFiAPData
  repeated WiFiRTTReading wifi_rtt_data = 13;  // new
  repeated WiFi_Sample ble_fingerprints = 14;  // new (same type as wifi)
  repeated BleData ble_data = 15;              // new

  // UNIX timestamp (in milliseconds) recorded from the start of this
  // trajectory data collection event. All future
  // timestamps in sub classes are to be RELATIVE timestamps
  // (in milliseconds) to this start time.
  // E.g.
  // start_timestamp = 1674819807315 (UTC 27 Jan 2023 in the morning)
  // relative_timestamp = 3000 (3s)
  int64 start_timestamp = 16;
  GNSSPosition initial_position = 17;            // new
  repeated GNSSPosition corrected_positions = 18; // new

  Sensor_Info accelerometer_info = 19;   // new proto: SensorInfo
  Sensor_Info gyroscope_info = 20;
  Sensor_Info rotation_vector_info = 21;
  Sensor_Info magnetometer_info = 22;
  Sensor_Info barometer_info = 23;
  Sensor_Info light_sensor_info = 24;
  Sensor_Info proximity_info = 25;       // new

  repeated GNSSPosition test_points = 26; // new
  string trajectory_name = 27; // user-defined display name
}

// new proto: RelativePosition (structure identical, just renamed)
message Pdr_Sample {
  // milliseconds from the start_timestamp
  int64 relative_timestamp = 1;

  // Both in metres. You should implement an algorithm to estimate
  // these values. The values are always relative to your start point
  // so the first entry should always be x = 0.0, y = 0.0
  float x = 2;
  float y = 3;
}

// new proto: IMUReading (uses nested Vector3/Quaternion to match server format)
message Motion_Sample {
  // milliseconds
  int64 relative_timestamp = 1;
  // Accelerometer [m/s^2]
  Vector3 acc = 2;

  // Gyroscope [radians/s]
  Vector3 gyr = 3;

  // Orientation [unitless], 4 components should square sum to ~1
  Quaternion rotation_vector = 4;

  // Number of steps so far
  int32 step_count = 5;
}

// new proto: MagnetometerReading (uses nested Vector3 to match server format)
message Position_Sample {
  int64 relative_timestamp = 1;

  // Magnetometer [uT]
  Vector3 mag = 2;
}

// new proto: BarometerReading (structure identical, just renamed)
message Pressure_Sample {
  int64 relative_timestamp = 1;

  // mbar
  float pressure = 2;
}

// new proto: LightReading (structure identical, just renamed)
message Light_Sample {
  int64 relative_timestamp = 1;
  // lux
  float light = 2;
}

// new (no old equivalent)
message ProximityReading {
  int64 relative_timestamp = 1;
  // cm
  float distance = 2;
}

// new (used by test_points, initial_position, corrected_positions)
message GNSSPosition {
  int64 relative_timestamp = 1;

  // degrees (minimum 6 significant figures)
  // latitude between -90 and 90
  double latitude = 2;
  // longitude between -180 and 180
  double longitude = 3;
  //metres
  double altitude = 4;
  // floor name
  optional string floor = 5;
}

// new proto: GNSSReading (uses nested GNSSPosition to match server format)
message GNSS_Sample {
  GNSSPosition position = 1;

  // metres
  float accuracy = 2;

  // m/s
  float speed = 3;

  // degrees
  float bearing = 4;

  // e.g 'gps' or 'network'
  string provider = 5;
}

// new proto: Fingerprint (renamed, field rf_scans -> mac_scans for code compatibility)
message WiFi_Sample {
  int64 relative_timestamp = 1;
  repeated Mac_Scan mac_scans = 2;  // new proto: rf_scans
}

// new proto: RFScan (renamed, added optional position field from new proto)
message Mac_Scan {
  int64 relative_timestamp = 1;

  // Integer encoding of the hex mac address (BSSID)
  // e.g. 207394925843984
  int64 mac = 2;

  // rssi integer in dBm.
  // typically between -120 and -10
  int32 rssi = 3;

  // returned position (new)
  optional GNSSPosition position = 4;
}

// new (no old equivalent)
message WiFiRTTReading {
  int64 relative_timestamp = 1;
  // Integer encoding of the hex mac address (BSSID)
  // e.g. 207394925843984
  int64 mac = 2;

  // in mm
  float distance = 3;
  // in mm
  float distance_std = 4;
  // rssi integer in dBm.
  // typically between -120 and -10
  int32 rssi = 5;
}

// new proto: WiFiAPData (renamed, added rtt_enabled field from new proto)
message AP_Data {
  // Integer encoding of the hex mac address (BSSID)
  // e.g. 207394925843984
  int64 mac = 1;

  // E.g. 'Eduroam' or 'Starbucks_free_wifi'
  string ssid = 2;

  // Typically 2.4GHz or 5GHz
  int64 frequency = 3;

  // Flag to indicate if the AP supports RTT measurements (new)
  bool rtt_enabled = 4;
}

// new (no old equivalent)
message BleData {
  string mac_address = 1;
  string name = 2;
  int32 tx_power_level = 3;
  int32 advertise_flags = 4;
  repeated string service_uuids = 5;
  bytes manufacturer_data = 6;
}

// --- Common Types (new) ---
message Vector3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

message Quaternion {
  float x = 1;
  float y = 2;
  float z = 3;
  float w = 4;
}

// new proto: SensorInfo (renamed, added max_range and frequency from new proto)
message Sensor_Info {
  string name = 1;
  string vendor = 2;
  float resolution = 3;
  float power = 4;
  int32 version = 5;
  int32 type = 6;
  float max_range = 7;   // new
  float frequency = 8;   // new
}
